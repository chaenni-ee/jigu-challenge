<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구력 챌린지 인증</title>
<style>
@font-face{font-family:'Ttwimteul';src:url(fonts/Ttwimteul-R.ttf) format('truetype');font-display:swap}
@font-face{font-family:'DgB';src:url(fonts/Dunggeunmiso-B.ttf) format('truetype');font-display:swap}
@font-face{font-family:'DgR';src:url(fonts/Dunggeunmiso-R.ttf) format('truetype');font-display:swap}
@font-face{font-family:'Stt';src:url(fonts/Santteutdotum-M.ttf) format('truetype');font-display:swap}
:root{--paper:#F6F5F2;--ink:#000;--grass:#90C54F;--earth:#77ACF1;--sky:#A2DCF4;--sun:#FFC163;--peach:#E4D4C9;--flame:#FF4810;--muted:#545454;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Stt','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 6px;max-width:980px;margin:0 auto}
header.top h1{font-family:'Ttwimteul',sans-serif;font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1}
header.top .tag{font-family:'DgR',sans-serif;font-size:15px;color:var(--muted)}
.demo{background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-family:'DgB',sans-serif;font-size:14px;white-space:nowrap}
.card{background:var(--white);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:14px}
.sec-title{font-family:'DgB',sans-serif;font-size:22px;margin:22px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:3px solid var(--ink);border-radius:999px;background:var(--white);font-family:'DgB',sans-serif;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--grass)}
.btn.blue{background:var(--earth)}
.btn.sun{background:var(--sun)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{background:#ffd9cc}
.seg{display:flex;gap:0;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--white);width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:10px 22px;font-family:'DgB',sans-serif;font-size:17px;cursor:pointer;min-height:46px}
.seg button.on{background:var(--ink);color:var(--white)}
label.f{display:flex;flex-direction:column;gap:6px;font-family:'DgB',sans-serif;font-size:16px}
input.in,select.in,textarea.in{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--white);font-family:'Stt',sans-serif;font-size:18px;min-height:48px;width:100%}
textarea.in{min-height:140px;resize:vertical}
.hint{font-size:15px;color:var(--muted);line-height:1.5}
.err{color:#b3261e;font-family:'DgB',sans-serif;font-size:16px}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-family:'DgB',sans-serif;font-size:13px;background:var(--sky);white-space:nowrap}
/* tab bar = 초록 땅 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--grass);border-top:6px solid var(--ink);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;gap:8px;max-width:980px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;font-family:'DgB',sans-serif;font-size:16px;padding:6px 4px;border-radius:14px;cursor:pointer;min-height:58px}
nav.tabs button.on{background:var(--white);border:3px solid var(--ink)}
nav.tabs svg{width:26px;height:26px}
/* dots & stamps */
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.dot.on{background:var(--grass)}
.stamp{display:inline-grid;place-items:center;border-radius:50%;border:3px double var(--flame);color:var(--flame);font-family:'DgB',sans-serif;transform:rotate(-12deg);background:rgba(255,72,16,.06)}
.stamp.empty{border:2px dashed #b9b4ac;color:#b9b4ac;background:transparent;transform:none}
/* student grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.scard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.scard .nm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scard .nm b{font-family:'DgB',sans-serif;font-size:20px;font-weight:400}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.mrow span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gcard{padding:0;overflow:hidden}
.gcard .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:3px solid var(--ink)}
.gcard .gh h3{font-family:'DgB',sans-serif;font-weight:400;font-size:24px}
.gcard .gb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.member{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px dotted #c9c4bb;font-size:16px}
.member:last-child{border-bottom:0}
.gstamps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* verify */
.mchoice{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--white);cursor:pointer;min-height:96px;box-shadow:3px 3px 0 var(--ink);font-size:18px}
.mbtn.sel{background:var(--sun)}
.mbtn[disabled]{background:#ece9e3;color:#6b6760;cursor:not-allowed;box-shadow:none}
.mbtn small{font-size:14px;color:var(--muted)}
.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:3px dashed var(--ink);border-radius:14px;min-height:200px;background:var(--white);cursor:pointer;padding:16px;text-align:center}
.photo-drop img{max-width:100%;max-height:340px;border-radius:10px;border:2px solid var(--ink)}
/* modal & overlay */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:20px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal .mh h2{font-family:'DgB',sans-serif;font-weight:400;font-size:24px}
.mission-detail{border:2px solid var(--ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;background:var(--paper)}
.slots{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.slot{min-width:92px;min-height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--white);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;font-family:'DgB',sans-serif;font-size:15px;cursor:pointer}
.slot.empty{border-style:dashed;color:#9b968e;cursor:default;background:transparent}
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(246,245,242,.92);z-index:60;flex-direction:column;gap:18px;text-align:center;padding:20px}
.celebrate .big{width:min(62vw,300px);height:min(62vw,300px);font-size:min(13vw,62px);line-height:1.1;border-width:10px;animation:thump .55s cubic-bezier(.2,1.6,.4,1) both}
.celebrate .check{width:150px;height:150px;border-radius:50%;background:var(--grass);border:5px solid var(--ink);display:grid;place-items:center;animation:pop .4s ease-out both}
.celebrate p{font-family:'DgB',sans-serif;font-size:clamp(22px,4vw,32px)}
@keyframes thump{0%{transform:scale(2.6) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-12deg)}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.celebrate .big,.celebrate .check{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
table.st{width:100%;border-collapse:collapse;font-size:16px}
table.st th,table.st td{border-bottom:2px solid #d9d4cb;padding:8px 6px;text-align:left}
table.st th{font-family:'DgB',sans-serif;font-weight:400}
.pin{width:92px;text-align:center;letter-spacing:4px}
.savebar{position:sticky;bottom:86px;display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.empty-state{padding:28px;text-align:center;line-height:1.6}
@media print{nav.tabs,header.top,.noprint{display:none!important}.wrap{padding:0}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>지구력 챌린지</h1>
    <p class="tag">#지구를 구하는 힘 #지구력 #모두함께지구구해버려</p>
  </div>
  <span id="demoTag"></span>
</header>
<main class="wrap" id="app"><p class="empty-state">불러오는 중…</p></main>
<nav class="tabs" aria-label="메뉴"><div class="in">
  <button data-tab="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>미션 현황</button>
  <button data-tab="verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.6"/></svg>미션 인증하기</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>설정(교사)</button>
</div></nav>
<div id="layer"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';

const DEMO = !firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('여기에');
const NEED = 3; // 같은 미션을 서로 다른 날 3번

/* ---------------- 저장소 ---------------- */
async function firebaseApi(){
  const V = '10.12.2';
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const metaRef = fs.doc(db,'app','meta'), pinsRef = fs.doc(db,'app','pins'), progRef = fs.doc(db,'app','progress');
  return {
    watchMeta: cb => fs.onSnapshot(metaRef, s => cb(s.exists() ? s.data() : null), e => fail(e)),
    watchProgress: cb => fs.onSnapshot(progRef, s => cb(s.exists() ? (s.data().p || {}) : {}), e => fail(e)),
    saveMeta: m => fs.setDoc(metaRef, m),
    getPins: async () => { const s = await fs.getDoc(pinsRef); return s.exists() ? (s.data().pins || {}) : {}; },
    savePins: p => fs.setDoc(pinsRef, { pins: p }),
    submit: async ({ sid, mid, date, data }) => {
      const b = fs.writeBatch(db);
      b.set(fs.doc(db,'photos',`${sid}_${mid}_${date}`), { sid, mid, date, data, at: fs.serverTimestamp() });
      b.set(progRef, { p: { [sid]: { [mid]: fs.arrayUnion(date) } } }, { merge: true });
      await b.commit();
    },
    getPhoto: async id => { const s = await fs.getDoc(fs.doc(db,'photos',id)); return s.exists() ? s.data().data : null; },
    remove: async ({ sid, mid, date }) => {
      const b = fs.writeBatch(db);
      b.delete(fs.doc(db,'photos',`${sid}_${mid}_${date}`));
      b.set(progRef, { p: { [sid]: { [mid]: fs.arrayRemove(date) } } }, { merge: true });
      await b.commit();
    }
  };
}
function demoApi(){
  const K = 'jiguDemo:'; const subs = { meta: [], prog: [] };
  const get = k => { try { return JSON.parse(localStorage.getItem(K+k)); } catch { return null; } };
  const put = (k,v) => { try { localStorage.setItem(K+k, JSON.stringify(v)); } catch { alert('체험 모드 저장 공간이 가득 찼어요.'); throw new Error('quota'); } };
  const emit = () => { subs.meta.forEach(f => f(get('meta'))); subs.prog.forEach(f => f(get('prog') || {})); };
  return {
    watchMeta: cb => { subs.meta.push(cb); setTimeout(() => cb(get('meta'))); },
    watchProgress: cb => { subs.prog.push(cb); setTimeout(() => cb(get('prog') || {})); },
    saveMeta: async m => { put('meta', m); emit(); },
    getPins: async () => get('pins') || {},
    savePins: async p => put('pins', p),
    submit: async ({ sid, mid, date, data }) => {
      const id = `${sid}_${mid}_${date}`; const photos = get('photos') || {};
      if (photos[id]) { const e = new Error('exists'); e.code = 'permission-denied'; throw e; }
      photos[id] = data; put('photos', photos);
      const p = get('prog') || {}; p[sid] = p[sid] || {}; p[sid][mid] = [...new Set([...(p[sid][mid] || []), date])]; put('prog', p); emit();
    },
    getPhoto: async id => (get('photos') || {})[id] || null,
    remove: async ({ sid, mid, date }) => {
      const photos = get('photos') || {}; delete photos[`${sid}_${mid}_${date}`]; put('photos', photos);
      const p = get('prog') || {}; if (p[sid]?.[mid]) p[sid][mid] = p[sid][mid].filter(d => d !== date); put('prog', p); emit();
    }
  };
}
function fail(e){ console.error(e); app.innerHTML = `<div class="card empty-state"><p class="err">데이터를 불러오지 못했어요.</p><p class="hint">Firebase 설정값과 Firestore 규칙을 확인해 주세요.<br>${esc(e.code || e.message || '')}</p></div>`; }

/* ---------------- 도우미 ---------------- */
const app = document.getElementById('app'), layer = document.getElementById('layer');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ymd = d => { const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const today = () => ymd(new Date());
const md = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const uid = p => p + Math.random().toString(36).slice(2, 8);
const ss = { get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k){ try { sessionStorage.removeItem(k); } catch {} } };
async function hash(s){
  if (crypto?.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jigu:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for (const c of 'jigu:' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h;
}
const stampSvg = (size, label = '지구력') => `<span class="stamp" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.28)}px" aria-label="${esc(label)} 도장">${esc(label)}</span>`;
const emptyStamp = size => `<span class="stamp empty" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.3)}px" aria-hidden="true">?</span>`;
const dots = n => `<span class="dots" aria-label="${Math.min(n,NEED)}/${NEED}">${[0,1,2].map(i => `<span class="dot ${i < n ? 'on' : ''}"></span>`).join('')}</span>`;

/* ---------------- 상태 ---------------- */
let api, meta = null, prog = {}, metaLoaded = false;
let tab = ss.get('tab') || 'status', view = ss.get('view') || 'group';
let teacher = !!ss.get('teacher'), me = ss.get('me');
let draft = null, draftPins = null;
let form = { mid: null, date: today(), photo: null, busy: false, msg: '' };

const groups = () => meta?.groups || [];
const students = () => (meta?.students || []).slice().sort((a,b) => a.no - b.no);
const groupOf = s => groups().find(g => g.id === s.groupId);
const membersOf = g => students().filter(s => s.groupId === g.id);
const datesOf = (sid, mid) => (prog[sid]?.[mid] || []).slice().sort();
const cnt = (sid, mid) => datesOf(sid, mid).length;
const missionsOf = s => groupOf(s)?.missions || [];
const successOf = s => missionsOf(s).filter(m => cnt(s.id, m.id) >= NEED).length;
const groupStamped = (g, m) => { const ms = membersOf(g); return ms.length > 0 && ms.every(s => cnt(s.id, m.id) >= NEED); };

/* ---------------- 화면: 미션 현황 ---------------- */
function renderStatus(){
  if (!meta || !students().length) return `<div class="card empty-state"><p class="sec-title" style="margin-top:0">아직 학급 설정이 없어요</p><p class="hint">선생님이 '설정(교사)' 탭에서 학생 명단, 모둠, 모둠별 미션을 먼저 입력해 주세요.</p></div>`;
  const seg = `<div class="seg" role="tablist"><button class="${view==='group'?'on':''}" data-view="group">모둠별 보기</button><button class="${view==='student'?'on':''}" data-view="student">학생별 보기</button></div>`;
  let body;
  if (view === 'student') {
    body = `<div class="grid">${students().map(s => {
      const ms = missionsOf(s), g = groupOf(s);
      return `<button class="card scard" data-student="${s.id}">
        <div class="nm"><b>${s.no}. ${esc(s.name)}</b>${g ? `<span class="chip">${esc(g.name)}</span>` : ''}</div>
        <div class="row" style="gap:8px">${stampSvg(40)}<span style="font-family:'DgB';font-size:22px">${successOf(s)}</span><span class="hint">/ ${ms.length}개 성공</span></div>
        ${ms.map(m => `<div class="mrow"><span class="t">${esc(m.text)}</span>${dots(cnt(s.id, m.id))}</div>`).join('') || '<p class="hint">미션이 아직 없어요</p>'}
      </button>`; }).join('')}</div>`;
  } else {
    const colors = ['var(--earth)','var(--sun)','var(--grass)','var(--sky)','var(--peach)','#F2C6DE','#CDE7B0','#FFD9A8'];
    body = `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${groups().map((g, i) => {
      const ms = membersOf(g), got = g.missions.filter(m => groupStamped(g, m)).length;
      return `<div class="card gcard">
        <div class="gh" style="background:${colors[i % colors.length]}"><h3>${esc(g.name)}</h3><span style="font-family:'DgB';font-size:18px">모둠 도장 ${got} / ${g.missions.length}</span></div>
        <div class="gb">
          <div class="gstamps">${g.missions.map(m => groupStamped(g, m) ? stampSvg(54, '모둠') : emptyStamp(54)).join('') || '<span class="hint">미션이 아직 없어요</span>'}</div>
          <div>${ms.map(s => `<button class="member" data-student="${s.id}" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left"><span>${esc(s.name)}</span><span class="row" style="gap:6px"><span class="hint">성공</span><b style="font-family:'DgB';font-weight:400;font-size:18px">${successOf(s)}개</b></span></button>`).join('') || '<p class="hint">모둠원이 없어요</p>'}</div>
          ${g.missions.length ? `<div class="col" style="gap:6px">${g.missions.map(m => { const done = ms.filter(s => cnt(s.id, m.id) >= NEED).length; return `<div class="mrow"><span class="t">${esc(m.text)}</span><span class="hint" style="white-space:nowrap">${done}/${ms.length}명 성공</span></div>`; }).join('')}</div>` : ''}
        </div></div>`; }).join('')}</div>`;
  }
  return `<div class="row" style="justify-content:space-between;margin:6px 0 16px">${seg}<span class="hint">같은 미션을 서로 다른 날 ${NEED}번 하면 도장 쾅!</span></div>${body}`;
}

function openStudent(sid){
  const s = students().find(x => x.id === sid); if (!s) return;
  const ms = missionsOf(s);
  layer.innerHTML = `<div class="modal-bg" data-close><div class="card modal" role="dialog" aria-modal="true" aria-label="${esc(s.name)} 미션 현황">
    <div class="mh"><h2>${esc(s.name)} · ${esc(groupOf(s)?.name || '모둠 없음')}</h2><button class="btn small" data-close>닫기</button></div>
    ${ms.map(m => { const ds = datesOf(s.id, m.id); return `<div class="mission-detail">

async function compress(file){
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 1024 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  let q = 0.72, out = c.toDataURL('image/jpeg', q);
  while (out.length > 600000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
  return out;
}
async function send(){

  form.busy = true; form.msg = ''; render();
  try {
    await api.submit({ sid: s.id, mid: m.id, date: form.date, data: form.photo });
    const after = [...new Set([...datesOf(s.id, m.id), form.date])].length;
    prog[s.id] = prog[s.id] || {}; prog[s.id][m.id] = [...new Set([...(prog[s.id][m.id] || []), form.date])];
    const g = groupOf(s), groupNow = after >= NEED && g && groupStamped(g, m);

  if (!draft) return;
  if (t.dataset.gname) draft.groups.find(g => g.id === t.dataset.gname).name = t.value;
  if (t.dataset.mtext) { const [gid, mid] = t.dataset.mtext.split('|'); draft.groups.find(g => g.id === gid).missions.find(m => m.id === mid).text = t.value; }
  if (t.dataset.spin) { t.value = t.value.replace(/\D/g, '').slice(0, 4); draftPins[t.dataset.spin] = t.value; }
});
app.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.sgroup && draft) { draft.students.find(s => s.id === t.dataset.sgroup).groupId = t.value; }
  if (t.id === 'photoIn' && t.files[0]) {
    form.msg = '사진 준비 중…'; render();
    try { form.photo = await compress(t.files[0]); form.msg = ''; } catch { form.photo = null; form.msg = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'; }
    render();
  }
});
app.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, d = new FormData(f);
  if (f.id === 'loginForm') {
    const pins = await api.getPins();
    if (pins[d.get('sid')] && pins[d.get('sid')] === d.get('pin')) { me = d.get('sid'); ss.set('me', me); form = { mid: null, date: today(), photo: null, busy: false, msg: '' }; render(); }
    else document.getElementById('loginErr').textContent = '이름이나 비밀번호가 맞지 않아요.';
  }
  if (f.id === 'initForm') {
    if (d.get('pw') !== d.get('pw2')) { document.getElementById('initErr').textContent = '두 비밀번호가 달라요.'; return; }
    const groupsInit = Array.from({ length: 6 }, (_, i) => ({ id: uid('g'), name: `${i + 1}모둠`, missions: [] }));
    await api.saveMeta({ teacherHash: await hash(d.get('pw')), startDate: today(), groups: groupsInit, students: [] });
    await api.savePins({});
    teacher = true; ss.set('teacher', true); meta = meta || { teacherHash: 'x', groups: groupsInit, students: [] }; enterSettings();
  }
  if (f.id === 'unlockForm') {
    if (await hash(d.get('pw')) === meta.teacherHash) { teacher = true; ss.set('teacher', true); enterSettings(); }
    else document.getElementById('unlockErr').textContent = '비밀번호가 맞지 않아요.';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) { const top = document.getElementById('photoModal'); if (top) top.remove(); else layer.innerHTML = ''; } });

/* ---------------- 시작 ---------------- */
if (DEMO) document.getElementById('demoTag').innerHTML = '<span class="demo">체험 모드 · 이 기기에만 저장</span>';
try { api = DEMO ? demoApi() : await firebaseApi(); } catch (e) { fail(e); throw e; }
api.watchMeta(m => {
  meta = m; metaLoaded = true;
  if (me && !students().some(s => s.id === me)) { me = null; ss.del('me'); }
  if (tab === 'settings' && draft) return; // 편집 중에는 화면을 덮어쓰지 않기
  if (tab === 'settings' && teacher && meta?.teacherHash && !draft) return enterSettings();
  render();
});
api.watchProgress(p => { prog = p || {}; if (!(tab === 'settings' && draft)) render(); });
render();
</script>
</body>
